name: ${COMPOSE_PROJECT_NAME:-riverking-prod}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverking}
      POSTGRES_USER: ${POSTGRES_USER:-riverking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${RIVERKING_POSTGRES_DATA_DIR:?RIVERKING_POSTGRES_DATA_DIR is required}
        target: /var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-riverking} -d $${POSTGRES_DB:-riverking}"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${RIVERKING_IMAGE:-riverking:${IMAGE_TAG:-local}}
    build:
      context: ../..
      dockerfile: infra/docker-host/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      CONFIG_PATH: /config/config.properties
      DATABASE_URL: ${DATABASE_URL:-jdbc:sqlite:/data/riverking.db}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-10}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-2}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-3000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-600000}
      DATABASE_MAX_LIFETIME_MS: ${DATABASE_MAX_LIFETIME_MS:-1800000}
      DATABASE_LEAK_DETECTION_THRESHOLD_MS: ${DATABASE_LEAK_DETECTION_THRESHOLD_MS:-0}
      DATABASE_DISPATCHER_THREADS: ${DATABASE_DISPATCHER_THREADS:-10}
      EVENT_ASSETS_DIR: ${EVENT_ASSETS_DIR:-/data/event-assets}
      PORT: ${PORT:-5005}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseG1GC}
    volumes:
      - type: bind
        source: ${RIVERKING_CONFIG_FILE:?RIVERKING_CONFIG_FILE is required}
        target: /config/config.properties
        read_only: true
      - type: bind
        source: ${RIVERKING_DATA_DIR:?RIVERKING_DATA_DIR is required}
        target: /data
    expose:
      - "5005"
    networks:
      default:
      tunnel:
        aliases:
          - ${TUNNEL_APP_ALIAS:-riverking-prod-app}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${PORT:-5005}/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  tunnel:
    external: true
    name: ${HDC_TUNNEL_NETWORK:-hdc-tunnel}
