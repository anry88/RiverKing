name: ${STUB_COMPOSE_PROJECT_NAME:-riverking-prod-stub}

services:
  gameplay-stub:
    image: ${STUB_IMAGE:-riverking-gameplay-stub:local}
    build:
      context: ../..
      dockerfile: gameplay-stub/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      STUB_SERVER_URL: ${STUB_SERVER_URL:-http://app:5005}
      STUB_ACCOUNT_PAUSE_SECONDS: ${STUB_ACCOUNT_PAUSE_SECONDS:-10}
      STUB_STATE_DIR: /data/gameplay-stub
    volumes:
      - type: bind
        source: ${RIVERKING_DATA_DIR:?RIVERKING_DATA_DIR is required}/gameplay-stub
        target: /data/gameplay-stub
    networks:
      - backend
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/*", "stub.MainKt", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: ${STUB_BACKEND_NETWORK:-riverking-prod_default}
