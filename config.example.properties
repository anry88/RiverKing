BOT_TOKEN=TEST
BOT_NAME=river_king_bot
PUBLIC_BASE_URL=http://localhost:8080
# Override the default official River King itch.io page if needed.
RIVERKING_ITCH_PROJECT_URL=
# Optional public Google Play listing URL used in Android update prompts.
RIVERKING_PLAY_STORE_URL=
# Optional direct APK URL used by the Android direct flavor for in-app downloads.
RIVERKING_ANDROID_DIRECT_DOWNLOAD_URL=
# Local SQLite default:
DATABASE_URL=jdbc:sqlite:/data/riverking.db
# Docker PostgreSQL example:
# DATABASE_URL=jdbc:postgresql://postgres:5432/riverking
DATABASE_USER=riverking
DATABASE_PASSWORD=change-me
# Hikari connection pool and bounded DB dispatcher.
# For SQLite, the app forces max pool size and dispatcher threads to 1.
DATABASE_MAX_POOL_SIZE=10
DATABASE_MIN_IDLE=2
DATABASE_CONNECTION_TIMEOUT_MS=3000
DATABASE_IDLE_TIMEOUT_MS=600000
DATABASE_MAX_LIFETIME_MS=1800000
DATABASE_LEAK_DETECTION_THRESHOLD_MS=0
DATABASE_DISPATCHER_THREADS=10
PORT=8080
DEV_MODE=true
ADMIN_TG_ID=0
PROVIDER_TOKEN=stars
# Telegram bot webhook secret for /bot requests.
TELEGRAM_WEBHOOK_SECRET=dev-secret
TG_ANALYTICS_TOKEN=
TG_ANALYTICS_SCRIPT_URL=https://tganalytics.xyz/index.js
TG_ANALYTICS_APP_NAME=river_king
# PlayDeck integration: game token is provided by PlayDeck and used for postback HMAC validation.
PLAYDECK_GAME_TOKEN=
# Set true only while testing PlayDeck payments; wrapper sends an automatic successful postback.
PLAYDECK_TEST_PAYMENTS=false
AUTH_TOKEN_SECRET=change-me
AUTH_ACCESS_TOKEN_TTL_MINUTES=60
AUTH_REFRESH_TOKEN_TTL_DAYS=30
# Token used by the admin mobile application to authenticate with the backend
ADMIN_API_TOKEN=change-me
# Android Google sign-in web client id.
GOOGLE_AUTH_CLIENT_ID=your-web-client-id.apps.googleusercontent.com
# Backend-side Google Play purchase verification for the play flavor.
GOOGLE_PLAY_PACKAGE_NAME=com.riverking.mobile.play
GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=/absolute/path/to/google-play-service-account.json
